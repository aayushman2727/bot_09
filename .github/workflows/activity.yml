name: Activity Bot

on:
  # Run every weekday at 10:00 UTC (adjust as needed)
  # Use reasonable intervals — do not spam commits
  schedule:
    - cron: "0 10 * * 1-5"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      commits:
        description: "Number of commits to create (1–5)"
        required: false
        default: "1"

jobs:
  generate-activity:
    runs-on: ubuntu-latest

    # Required for GITHUB_TOKEN to push to this repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so git operations work correctly
          fetch-depth: 0
          # Use the built-in token — never hardcode credentials
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git identity for this workflow
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate activity
        # GITHUB_TOKEN is injected automatically — never store tokens in source code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMITS=${{ github.event.inputs.commits || '1' }}
          npm start -- generate --commits "$COMMITS" --push

      - name: Show recent commits (verification)
        run: git log --oneline -5
